<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title> — Architecture Diagram</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Segoe UI', Arial, sans-serif; background:#0d1117; padding:40px; }
  svg { display:block; margin:0 auto; }
  .host   { fill:#161b22; stroke:#58a6ff; stroke-width:2; rx:12; }
  .vm     { fill:#161b22; stroke:#3fb950; stroke-width:2; }
  .box    { fill:#1c2128; stroke:#8b949e; stroke-width:1.5; rx:8; }
  .store  { fill:#1c1a14; stroke:#d29922; stroke-width:1.5; rx:8; }
  .plane  { fill:none; stroke:#8b949e; stroke-width:1; stroke-dasharray:6 4; }
  .coord  { stroke:#a371f7; stroke-width:2.5; marker-end:url(#arrowPurple); }
  .tensor { stroke:#f0883e; stroke-width:2.5; marker-end:url(#arrowOrange); }
  .label  { fill:#c9d1d9; font-size:13px; }
  .title  { fill:#f0f6fc; font-size:16px; font-weight:bold; }
  .small  { fill:#8b949e; font-size:11px; }
  .h2     { fill:#58a6ff; font-size:15px; font-weight:bold; }
  .h2g    { fill:#3fb950; font-size:15px; font-weight:bold; }
  .port   { fill:#f0883e; font-size:11px; font-weight:bold; }
  .cport  { fill:#a371f7; font-size:11px; font-weight:bold; }
</style>
</head>
<body>
<svg width="1500" height="1050" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#a371f7"/></marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#f0883e"/></marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#8b949e"/></marker>
  </defs>

  <text x="750" y="30" text-anchor="middle" style="fill:#f0f6fc; font-size:24px; font-weight:bold;"> — Distributed Inference Architecture</text>

  <!-- ==================== HOST LAPTOP ==================== -->
  <rect x="30" y="60" width="1440" height="440" class="host" rx="12"/>
  <text x="55" y="90" class="h2">HOST LAPTOP — ty-20nks0qn15 (Arch, 16GB RAM)</text>

  <!-- Electron Coordinator -->
  <rect x="60" y="120" width="420" height="230" class="box" rx="8"/>
  <text x="270" y="145" text-anchor="middle" class="title">Electron Coordinator</text>
  <text x="270" y="170" text-anchor="middle" class="small">electron/main.ts · tcp-server.ts · ipc-handlers.ts</text>
  <text x="80" y="200" class="label">• Node registry (hello / welcome / heartbeat)</text>
  <text x="80" y="222" class="label">• Broadcasts INFER_START/PROGRESS/DONE</text>
  <text x="80" y="244" class="label">• shared/model-selection.ts (RAM picker):</text>
  <text x="80" y="264" class="label">    min(MemAvailable) → biggest fitting model</text>
  <text x="80" y="286" class="label">    → auto ollama pull → ASSIGN_LAYERS</text>
  <text x="80" y="315" class="cport">TCP 9501 (binds 0.0.0.0) · UI :5173 (vite)</text>
  <text x="80" y="338" class="small">renderer pages: Chat · Cluster · Dashboard</text>

  <!-- Ollama -->
  <rect x="60" y="380" width="420" height="95" class="store" rx="8"/>
  <text x="270" y="405" text-anchor="middle" class="title" style="fill:#d29922;">Ollama — model WAREHOUSE (port 11434)</text>
  <text x="80" y="430" class="label">Stores / pulls / caches GGUF weights.</text>
  <text x="80" y="450" class="label" style="fill:#d29922;">Never splits — whole completions only.</text>

  <!-- llama.cpp -->
  <rect x="560" y="120" width="430" height="230" class="box" rx="8"/>
  <text x="775" y="145" text-anchor="middle" class="title">llama.cpp tensor engine</text>
  <text x="775" y="170" text-anchor="middle" class="small">~/llamacpp/llama-b11191 (MIT, upstream)</text>
  <text x="580" y="200" class="label">llama-server -m qwen25-3b.gguf --rpc 127.0.0.1:19556</text>
  <text x="580" y="230" class="label">• ggml_backend_sched partitions compute graph</text>
  <text x="580" y="252" class="label">• host keeps: embeddings · final norm · lm_head</text>
  <text x="580" y="274" class="label">• remote gets: transformer blocks (weights</text>
  <text x="580" y="294" class="label">  shipped once, activations every token)</text>
  <text x="580" y="315" class="port">RPC client → 127.0.0.1:19556 (SSH tunnel)</text>

  <!-- CLI / UI entry -->
  <rect x="560" y="380" width="200" height="95" class="box" rx="8"/>
  <text x="660" y="410" text-anchor="middle" class="title">./setup ask "…"</text>
  <text x="660" y="435" text-anchor="middle" class="small">llama-cli --rpc … -st</text>
  <text x="660" y="458" text-anchor="middle" class="small">entry point (terminal)</text>

  <!-- start-cluster -->
  <rect x="1050" y="380" width="390" height="95" class="box" rx="8"/>
  <text x="1245" y="410" text-anchor="middle" class="title">scripts/start-cluster.sh  (./setup)</text>
  <text x="1245" y="435" text-anchor="middle" class="small">idempotent bring-up: VM → sshd → services</text>
  <text x="1245" y="455" text-anchor="middle" class="small">→ tunnel → coordinator → wait for hello</text>

  <!-- ==================== NETWORK ==================== -->
  <rect x="30" y="530" width="1440" height="90" fill="#0d1117" stroke="#8b949e" stroke-width="1" stroke-dasharray="6 4" rx="8"/>
  <text x="750" y="558" text-anchor="middle" class="h2" style="fill:#8b949e;">NETWORK BOUNDARY — QEMU slirp NAT · hostfwd 2222→22 · 9555→9555 · 9666→9666</text>
  <text x="750" y="585" text-anchor="middle" class="small">On two real PCs: same diagram, QEMU box disappears, hostfwd IPs become LAN IPs (192.168.x.x) — zero code changes</text>

  <!-- ==================== VM ==================== -->
  <rect x="30" y="650" width="1440" height="370" class="vm" rx="12"/>
  <text x="55" y="680" class="h2g">LUBUNTU VM "lubuntu-vm" — 4GB RAM · 4 vCPU (stand-in for any second laptop)</text>

  <!-- ttd-node -->
  <rect x="60" y="710" width="430" height="290" class="box" rx="8"/>
  <text x="275" y="735" text-anchor="middle" class="title">ttd-node.py — terminal node</text>
  <text x="275" y="758" text-anchor="middle" class="small">pipeline/ttd-node.py · pure stdlib · ~20MB RSS</text>
  <text x="80" y="788" class="label">connection_loop(): WORKER_HELLO → welcome</text>
  <text x="80" y="810" class="label">→ ASSIGN_LAYERS → HEARTBEAT_ACK (free RAM</text>
  <text x="80" y="830" class="label">in every ack) · reconnect backoff 3s→30s</text>
  <text x="80" y="852" class="label">1 Hz ANSI dashboard: status · layers · RAM bar</text>
  <text x="80" y="882" class="cport">→ TCP 9501 out to coordinator</text>
  <text x="80" y="906" class="cport">◄ control port 9666: STATUS/LOGS/CONNECT/QUIT</text>
  <text x="80" y="930" class="small">autostart: ~/.config/autostart/ttd-node.desktop</text>

  <!-- rpc server -->
  <rect x="560" y="710" width="430" height="290" class="box" rx="8"/>
  <text x="775" y="735" text-anchor="middle" class="title">ggml-rpc-server</text>
  <text x="775" y="758" text-anchor="middle" class="small">~/rpc/rpc-bin (same llama.cpp build as host)</text>
  <text x="580" y="788" class="label">--host 0.0.0.0 --port 9555</text>
  <text x="580" y="818" class="label">• receives serialized input tensors</text>
  <text x="580" y="840" class="label">• executes its subgraph on 4 vCPUs</text>
  <text x="580" y="862" class="label">• ships output hidden states back</text>
  <text x="580" y="892" class="port">listens TCP 9555 (via SSH tunnel from host)</text>
  <text x="580" y="916" class="small">no model file needed — weights stream on demand</text>
  <text x="580" y="938" class="small">⚠ dies silently on OOM: free RAM &gt; model + KV</text>

  <!-- sshd -->
  <rect x="1060" y="710" width="380" height="120" class="box" rx="8"/>
  <text x="1250" y="740" text-anchor="middle" class="title">sshd (port 22)</text>
  <text x="1250" y="765" text-anchor="middle" class="small">host ed25519 key authorized</text>
  <text x="1250" y="788" text-anchor="middle" class="small">command channel + tensor tunnel endpoint</text>
  <text x="1250" y="815" class="small" text-anchor="middle">hostfwd 2222→22</text>

  <!-- guest autostart -->
  <rect x="1060" y="860" width="380" height="140" class="store" rx="8"/>
  <text x="1250" y="890" text-anchor="middle" class="title" style="fill:#d29922;">Guest Ollama (11434)</text>
  <text x="1250" y="915" text-anchor="middle" class="small">same warehouse role: pulled gemma2:2b</text>
  <text x="1250" y="937" text-anchor="middle" class="small">whole completions only — not in split path</text>
  <text x="1250" y="965" text-anchor="middle" class="small">autostart: ttd-rpc.desktop · ttd-node.desktop</text>

  <!-- ==================== ARROWS ==================== -->
  <!-- coordination plane -->
  <path d="M 480 220 C 510 220, 520 620, 275 700" class="plane coord" fill="none"/>
  <text x="330" y="640" class="cport">coordination plane: HELLO / ASSIGN / HEARTBEAT (JSON, no model data)</text>

  <!-- tensor plane -->
  <path d="M 990 250 C 1080 250, 1150 600, 800 700" class="tensor" fill="none"/>
  <text x="1020" y="620" class="port">tensor plane: hidden states over SSH tunnel :19556 → :9555 (per token, both ways)</text>

  <!-- picker to ollama -->
  <path d="M 270 350 L 270 378" class="plane" fill="none" marker-end="url(#arrowGray)"/>
  <text x="285" y="368" class="small">auto pull</text>

  <!-- ask to llama.cpp -->
  <path d="M 660 378 L 660 352" class="plane" fill="none" marker-end="url(#arrowGray)"/>

  <!-- status legent -->
  <rect x="60" y="500" width="520" height="0" fill="none"/>
  <text x="60" y="516" class="small">— — purple = coordination plane (our code)    orange = tensor plane (llama.cpp RPC)    yellow = storage/warehouse</text>
</svg>
</body>
</html>
